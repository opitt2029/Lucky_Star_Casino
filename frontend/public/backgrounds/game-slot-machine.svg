<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Lucky Star slot machine</title>
  <desc id="desc">A red and gold slot machine with glowing reels, jackpot marquee, lever, and star coins.</desc>
  <defs>
