    <linearGradient id="cabinet" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#db1424"/><stop offset="0.56" stop-color="#65040c"/><stop offset="1" stop-color="#220105"/></linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
