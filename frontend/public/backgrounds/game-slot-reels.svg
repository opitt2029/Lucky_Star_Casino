<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Slot reels casino art</title>
  <desc id="desc">A dedicated slot machine illustration with glowing reels, cherries, sevens, and gold coins.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3d0308"/>
      <stop offset="0.48" stop-color="#7c0611"/>
      <stop offset="1" stop-color="#160103"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.46" stop-color="#f8d56a"/>
      <stop offset="1" stop-color="#a56408"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ca" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#ffd45c" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#8e0610" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="160" cy="124" r="170" fill="#ffeaa0" opacity="0.09"/>
  <circle cx="820" cy="570" r="210" fill="#c90d18" opacity="0.2"/>
  <g opacity="0.38" stroke="#ffeaa0" stroke-width="3">
    <path d="M54 590C208 468 330 485 456 548S712 644 900 484" fill="none"/>
    <path d="M84 150C258 72 414 93 560 165s250 91 342 34" fill="none"/>
  </g>
  <g transform="translate(170 104)">
    <rect x="54" y="44" width="520" height="474" rx="46" fill="#250205" stroke="url(#gold)" stroke-width="14"/>
    <rect x="94" y="94" width="440" height="276" rx="28" fill="#120204" stroke="#ffeaa0" stroke-opacity="0.45" stroke-width="5"/>
    <g transform="translate(118 116)">
      <rect width="116" height="230" rx="18" fill="#fff3bc" opacity="0.96"/>
      <rect x="150" width="116" height="230" rx="18" fill="#fff3bc" opacity="0.96"/>
      <rect x="300" width="116" height="230" rx="18" fill="#fff3bc" opacity="0.96"/>
      <g font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">
        <text x="58" y="90" font-size="66" fill="#c90d18">7</text>
        <text x="58" y="176" font-size="56" fill="#0f6b4a">BAR</text>
        <text x="208" y="88" font-size="58" fill="#b10813">CH</text>
        <circle cx="188" cy="146" r="24" fill="#c90d18"/>
        <circle cx="222" cy="150" r="24" fill="#de1b28"/>
        <path d="M208 124c18-32 46-36 70-26" fill="none" stroke="#157a4e" stroke-width="10" stroke-linecap="round"/>
        <text x="358" y="92" font-size="66" fill="#c90d18">7</text>
        <text x="358" y="178" font-size="56" fill="#0f6b4a">BAR</text>
      </g>
    </g>
    <rect x="134" y="403" width="360" height="64" rx="32" fill="url(#glass)" filter="url(#glow)"/>
    <circle cx="112" cy="435" r="18" fill="#ffeaa0"/>
    <circle cx="516" cy="435" r="18" fill="#ffeaa0"/>
    <path d="M590 150h64c24 0 42 18 42 42v86" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="698" cy="314" r="42" fill="#c90d18" stroke="url(#gold)" stroke-width="10"/>
  </g>
  <g fill="url(#gold)" stroke="#fff2ad" stroke-width="4">
