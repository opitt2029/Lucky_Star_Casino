<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">3D cherry slot symbol</title>
  <desc id="desc">A glossy pair of dimensional red cherries with metallic highlights.</desc>
  <defs>
    <filter id="cast" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#4a0710" flood-opacity="0.36"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.26"/>
    </filter>
    <radialGradient id="cherry" cx="31%" cy="25%" r="74%">
      <stop offset="0%" stop-color="#fff4f1"/>
      <stop offset="16%" stop-color="#ff7a78"/>
      <stop offset="55%" stop-color="#d7112d"/>
      <stop offset="100%" stop-color="#730012"/>
    </radialGradient>
    <radialGradient id="cherryDark" cx="34%" cy="26%" r="75%">
      <stop offset="0%" stop-color="#ffd7d0"/>
      <stop offset="35%" stop-color="#e51a34"/>
      <stop offset="100%" stop-color="#68000e"/>
    </radialGradient>
    <linearGradient id="stem" x1="27" y1="16" x2="58" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#497024"/>
      <stop offset="52%" stop-color="#24631f"/>
      <stop offset="100%" stop-color="#143811"/>
    </linearGradient>
    <linearGradient id="leaf" x1="48" y1="20" x2="76" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9ff91"/>
      <stop offset="48%" stop-color="#4fba45"/>
      <stop offset="100%" stop-color="#1f6b2d"/>
    </linearGradient>
  </defs>
  <ellipse cx="51" cy="84" rx="35" ry="8" fill="#260006" opacity="0.18"/>
  <g filter="url(#cast)">
    <path d="M48 43 C45 32 41 23 32 16" fill="none" stroke="url(#stem)" stroke-width="7" stroke-linecap="round"/>
    <path d="M58 44 C60 30 63 22 70 14" fill="none" stroke="url(#stem)" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 26 C60 16 73 17 84 25 C72 38 58 39 50 26Z" fill="url(#leaf)" stroke="#1f6b2d" stroke-width="2"/>
    <circle cx="38" cy="61" r="24" fill="url(#cherry)" stroke="#fff0d4" stroke-width="2"/>
    <circle cx="62" cy="60" r="23" fill="url(#cherryDark)" stroke="#fff0d4" stroke-width="2"/>
    <path d="M20 61 C24 77 38 87 53 79" fill="none" stroke="#4a0009" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <path d="M48 59 C52 75 64 83 79 75" fill="none" stroke="#4a0009" stroke-opacity="0.32" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="30" cy="52" rx="7" ry="5" fill="#fff8ee" opacity="0.86" transform="rotate(-25 30 52)"/>
    <ellipse cx="56" cy="51" rx="6" ry="4" fill="#fff8ee" opacity="0.78" transform="rotate(-23 56 51)"/>
  </g>
</svg>