      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffe98a" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="gold" x1="22" y1="16" x2="75" y2="84" gradientUnits="userSpaceOnUse">
