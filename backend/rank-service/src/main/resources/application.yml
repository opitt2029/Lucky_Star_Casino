server:
  port: 8084
  tomcat:
    mbeanregistry:
      # 開啟 Tomcat MBean 才會暴露 tomcat_threads_busy/current 指標（否則 /actuator/prometheus
      # 只有 tomcat_sessions_*，看不到執行緒池飽和）。壓測診斷前提，執行期開銷可忽略。（T-090 觀測補齊）
      enabled: true

spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: rank-service

  # 排程執行緒池：Spring Boot 預設只有 1 條，本服務 3 個 @Scheduled 都在 00:00 觸發
  # （週一三支同時），只能序列跑：DailyRankSnapshot 掃全部錢包餘額若慢，玩家立刻看得到的
  # resetDailyWinnings 就跟著延後。三支動的資料互不相交、無順序依賴，可安全並行：
  # snapshot 只讀 DB 餘額→寫 rank_daily_snapshots；daily reset 只 DEL rank:daily:winnings；
  # weekly reset 只碰 rank:global:coins 與 rank_history。
  task:
    scheduling:
      pool:
        size: 3

  # PostgreSQL（ADR-001：rank_history、rank_daily_snapshots）
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:lucky_star_casino}
    username: ${POSTGRES_USER:lucky_user}
    password: ${POSTGRES_PASSWORD:lucky_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # Schema 由 database/postgres/init.sql 管理；預設 validate，本機開發可在 .env 設 JPA_DDL_AUTO=update
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Redis — rank:global:coins ZSet（全服榜）、rank:friend ZSet（好友榜）、今日贏幣王
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
    consumer:
      group-id: rank-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

management:
  metrics:
    distribution:
      percentiles-histogram:
        # P99 直方圖（T-090 觀測性）：供 Prometheus histogram_quantile 計算延遲分位數
        "[http.server.requests]": true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.luckystar.rank: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:OFF}

app:
  dev-seed:
    enabled: ${RANK_DEV_SEED_ENABLED:false}
    player-count: ${RANK_DEV_SEED_PLAYER_COUNT:100}
    random-seed: ${RANK_DEV_SEED_RANDOM_SEED:20260727}
